<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>URLying - Blacklist Control</title>
  <link rel="stylesheet" href="../css/popup.css">
</head>

<body>
  <div class="container">
  <div class="header">
    <img src="../icons/icon_on_pages.png" alt="URLying Icon" class="logo">
    <p class="brand">URLying</p>
  </div>
  <hr class="divider">

  <div class="onOrOff">
    <p class="protection">Protection</p>
    <div class="checkbox-wrapper-8">
      <input type="checkbox" id="cb3-8" class="tgl tgl-skewed">
      <label for="cb3-8" data-tg-on="ON" data-tg-off="OFF" class="tgl-btn"></label>
    </div>
  </div>
  <button id="listBtn">Manage Lists</button>
  <hr class="divider">

  <button id="blacklistBtn">Add to Blacklist</button>
</div>


  <script src="../js/popup.js"></script>
</body>

</html>
